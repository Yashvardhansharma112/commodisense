name: Daily CommodiSense Pipeline

on:
  schedule:
    - cron: '0 6 * * 1-5'   # 6am UTC, Monday–Friday
  workflow_dispatch:          # allow manual trigger from Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # kill if something hangs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-pipeline.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Download FinBERT (cache in HF cache dir)
        run: |
          python -c "
          from transformers import AutoTokenizer, AutoModelForSequenceClassification
          AutoTokenizer.from_pretrained('ProsusAI/finbert')
          AutoModelForSequenceClassification.from_pretrained('ProsusAI/finbert')
          print('FinBERT cached OK')
          "

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-finbert-v1
          restore-keys: |
            ${{ runner.os }}-hf-finbert-

      - name: Run daily pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EIA_API_KEY:  ${{ secrets.EIA_API_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python pipeline/daily_run.py

      - name: Commit updated data
        run: |
          git config user.name  "CommodiSense Bot"
          git config user.email "bot@commodisense.ai"
          git add data/commodisense.duckdb data/reports/ data/logs/ || true
          git diff --cached --quiet || git commit -m "Daily update $(date +%Y-%m-%d)"
          git push || echo "Nothing to push"

      - name: Upload pipeline log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: data/logs/pipeline_*.log
          retention-days: 7
